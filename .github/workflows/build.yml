# Fatal Frame (Xbox) static recompilation - cloud build
#
# Runs the whole pipeline + MSVC build on GitHub runners:
#   parse XBE -> disasm -> func_id -> abi_analysis -> recomp to C -> compile .exe
#
# Game code never lands in this repository: the XBE is fetched from a private
# store at build time and the generated C + the built .exe only exist on the
# runner, then go to a private artifact repo.

name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  recompile:
    runs-on: windows-latest
    env:
      TOOLKIT_REF: v0.17.0
      TOOLKIT_REPO: sp00nznet/xboxrecomp
      ENGINE_REPO: Kapro777/fatal-frame-native-engine
      XBE_REPO: Kapro777/fatal-frame-xbe
      BUILDS_REPO: Kapro777/fatal-frame-builds
      ENGINE_DIR: ${{ github.workspace }}/engine
      TOOLKIT_DIR: ${{ github.workspace }}/xboxrecomp
    steps:
      - name: Checkout this repo (CI glue + docs)
        uses: actions/checkout@v4
        with:
          path: buildrepo

      - name: Checkout toolkit (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLKIT_REPO }}
          ref: ${{ env.TOOLKIT_REF }}
          path: xboxrecomp

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          path: engine

      - name: Fetch default.xbe from private store
        shell: pwsh
        env:
          TOKEN: ${{ secrets.PORT_BUILD_PAT }}
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          $headers = @{ Authorization = "Bearer $env:TOKEN" }
          $uri = "https://raw.githubusercontent.com/${{ env.XBE_REPO }}/main/default.xbe"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile "game/default.xbe"
          $len = (Get-Item game/default.xbe).Length
          Write-Host "default.xbe: $len bytes"
          if ($len -ne 1773568) { throw "unexpected XBE size: $len (expected 1773568)" }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install capstone
          python -c "import capstone; print('capstone', capstone.__version__)"

      - name: "Pipeline 2/5 - Parse XBE"
        working-directory: ${{ env.TOOLKIT_DIR }}
        run: python -m tools.xbe_parser ${{ github.workspace }}/game/default.xbe --json ${{ github.workspace }}/game/fatalframe_analysis.json

      - name: "Pipeline 3/5 - Disassemble"
        working-directory: ${{ env.TOOLKIT_DIR }}
        run: python -m tools.disasm ${{ github.workspace }}/game/default.xbe --text-only -v

      - name: "Pipeline 4a/5 - Identify functions"
        working-directory: ${{ env.TOOLKIT_DIR }}
        run: python -m tools.func_id ${{ github.workspace }}/game/default.xbe -v

      - name: "Pipeline 4b/5 - ABI analysis"
        working-directory: ${{ env.TOOLKIT_DIR }}
        run: python -m tools.abi_analysis ${{ github.workspace }}/game/default.xbe -v

      - name: "Pipeline 5/5 - Recompile to C"
        working-directory: ${{ env.TOOLKIT_DIR }}
        run: >
          python -m tools.recomp ${{ github.workspace }}/game/default.xbe --all --split 250
          --game-name "Fatal Frame"
          --gen-dir ${{ env.ENGINE_DIR }}/src/recomp/gen

      - name: "Check generated code"
        shell: pwsh
        run: |
          $gen = "${{ env.ENGINE_DIR }}/src/recomp/gen"
          $files = Get-ChildItem $gen -Filter *.c
          Write-Host "generated C files: $($files.Count)"
          $files | Select-Object Name, Length
          if ($files.Count -eq 0) { throw "recomp produced no C files" }

      - name: "Build 6/7 - Configure (CMake)"
        shell: pwsh
        run: |
          cmake --version
          Write-Host "engine CMakeLists present: $(Test-Path '${{ env.ENGINE_DIR }}/CMakeLists.txt')"
          cmake -S "${{ env.ENGINE_DIR }}" -B "${{ env.ENGINE_DIR }}/build" `
                -DXBOXRECOMP_DIR="${{ env.TOOLKIT_DIR }}" -A x64
          Write-Host "---- configured project ----"
          Select-String -Path "${{ env.ENGINE_DIR }}/build/CMakeCache.txt" -Pattern 'CMAKE_HOME_DIRECTORY|XBOXRECOMP_DIR' | ForEach-Object { $_.Line }
          $home = (Select-String -Path "${{ env.ENGINE_DIR }}/build/CMakeCache.txt" -Pattern '^CMAKE_HOME_DIRECTORY:INTERNAL=(.+)$').Matches[0].Groups[1].Value
          if ($home -ne "${{ env.ENGINE_DIR }}") { throw "configured the wrong project: $home" }

      - name: "Build 7/7 - Compile (MSVC, Release)"
        shell: pwsh
        run: cmake --build "${{ env.ENGINE_DIR }}/build" --config Release --target fatalframe_native --parallel

      - name: "Locate executable"
        shell: pwsh
        run: |
          $exe = Get-ChildItem "${{ env.ENGINE_DIR }}/build" -Recurse -Filter fatalframe_native.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Host "::error::executable not found under engine/build"
            Get-ChildItem "${{ env.ENGINE_DIR }}/build" -Recurse -Filter *.exe | Select-Object FullName
            exit 1
          }
          $exe | Select-Object FullName, Length

      - name: "Collect pipeline outputs for the private store"
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path outputs | Out-Null
          Copy-Item "${{ env.ENGINE_DIR }}/build/Release/fatalframe_native.exe" outputs/ -ErrorAction SilentlyContinue
          foreach ($d in @("${{ env.TOOLKIT_DIR }}/tools/disasm/output", "${{ env.TOOLKIT_DIR }}/tools/func_id/output", "${{ env.TOOLKIT_DIR }}/tools/abi_analysis/output")) {
            if (Test-Path $d) { Copy-Item $d outputs -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem outputs | Select-Object Name, Length

      - name: "Publish to private artifact store"
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PORT_BUILD_PAT }}
        run: |
          $repo = "${{ env.BUILDS_REPO }}"
          $exe = "${{ env.ENGINE_DIR }}/build/Release/fatalframe_native.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath fatalframe_native.zip -Force
            gh release create "run-${{ github.run_id }}" fatalframe_native.zip --repo $repo --title "build run ${{ github.run_id }}" --notes "Automated static-recompilation build. Contains the game's code - private use only."
          } else {
            Write-Host "::warning::no executable produced - nothing to publish"
          }